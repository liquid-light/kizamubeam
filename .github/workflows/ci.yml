
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and Vite build
        run: npm run build

      - name: G-code regression tests
        run: npm run test:gcode

      - name: Contour topology tests
        run: npm run test:contour-topology

      - name: Path tests
        run: npm run test:paths

  slots:
    name: slots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Slot and notch placement tests
        run: npm run test:slot-placement && npm run test:straight-slots && npm run test:contour-slots && npm run test:slot-features && npm run test:slot-worker && npm run test:slots
